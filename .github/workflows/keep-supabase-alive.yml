name: Keep Supabase Project Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within Supabase's 7-day inactivity threshold)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase database to prevent auto-pause..."
          
          # Clean and sanitize the URL (remove trailing slashes, quotes, or accidental spaces)
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          RAW_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          if [ -z "$RAW_URL" ] || [ -z "$RAW_KEY" ]; then
            echo "❌ Error: SUPABASE_URL or SUPABASE_ANON_KEY secret is empty or missing in GitHub Repository Secrets."
            echo "Please check Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          # Strip surrounding quotes and trailing slashes
          URL=$(echo "$RAW_URL" | tr -d '"' | tr -d "'" | sed 's visually\/$//' | xargs)
          KEY=$(echo "$RAW_KEY" | tr -d '"' | tr -d "'" | xargs)
          
          # Remove trailing slash if present
          URL="${URL%/}"

          TARGET_ENDPOINT="${URL}/rest/v1/"
          echo "Targeting Endpoint: $TARGET_ENDPOINT"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$TARGET_ENDPOINT")
            
          echo "Supabase HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Successfully pinged Supabase! Database keep-alive active."
          else
            echo "❌ Failed to ping Supabase. HTTP status: $HTTP_STATUS"
            exit 1
          fi

